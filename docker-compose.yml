services:
  app:
    build: .
    ports:
      - "8080:1323"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/database?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure
  db:
    platform: linux/x86_64
    image: postgres:14.1-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: database
    ports:
      - 5432:5432
    expose:
      - 5432
    volumes:
      - db:/var/lib/postgresql/data
      # Load database schema from ./database.sql
      # If you want to reload new database schema, you need to execute
      # `docker-compose down --volumes` first to remove the volume.
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    healthcheck:
      # -h localhost forces a TCP check. During init scripts the entrypoint runs a
      # temporary server on the Unix socket only, so a socket check would report
      # "ready" before database.sql has finished loading.
      test: ["CMD-SHELL", "pg_isready -h localhost -U postgres -d database"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
volumes:
  db:
    driver: local
